name: Daily Sync Codebase

on:
  workflow_dispatch:
  # schedule:
    # - cron: "30 0 * * *"
#    - cron: "30 0 1,15 * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and run sync script
        env:
          PAT_SYNC: ${{ secrets.sync }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${PAT_SYNC}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/strategy-sd3/py_script_for_release/contents/sync2_mirror_to_github.sh" \
            -o sync.sh
          chmod +x sync.sh
          bash sync.sh
